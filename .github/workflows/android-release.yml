name: Android Release AAB

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Play Store versionCode (must increase for every release)
        required: true
        default: '1'
      version_name:
        description: Human-readable version, for example 0.1.0
        required: true
        default: '0.1.0'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_FILE: /tmp/string-sort-release.jks
      RELEASE_VERSION_CODE: ${{ inputs.version_code }}
      RELEASE_VERSION_NAME: ${{ inputs.version_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Verify Android 16 / API 36 target
        run: node scripts/verify-android-target.mjs

      - name: Generate Android launcher and splash assets
        run: npm run assets:android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure release version and signing
        run: node scripts/prepare-android-signing.mjs

      - name: Build signed Android App Bundle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: string-sort-release-${{ inputs.version_name }}-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
