name: Play Store Screenshots

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/capture-store-screenshots.mjs'
      - 'store/source/**'
      - 'package.json'

concurrency:
  group: store-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build web app
        run: npm run build

      - name: Start local preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/string-sort-vite.log 2>&1 &
          echo $! > /tmp/string-sort-vite.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/string-sort-vite.log
          exit 1

      - name: Capture real UI screenshots
        run: npm run screenshots:store

      - name: Generate static store assets
        run: npm run assets:store

      - name: Upload Play Store package
        uses: actions/upload-artifact@v7
        with:
          name: string-sort-play-store-package
          path: store/generated/
          if-no-files-found: error
