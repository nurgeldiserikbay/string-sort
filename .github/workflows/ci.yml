name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Generate Play Store static assets
        run: npm run assets:store

      - name: Upload Play Store static assets
        uses: actions/upload-artifact@v7
        with:
          name: string-sort-store-static-assets
          path: store/generated/
          if-no-files-found: error

  android-smoke:
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Use Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Verify Android 16 / API 36 target
        run: node scripts/verify-android-target.mjs

      - name: Generate Android launcher and splash assets
        run: npm run assets:android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Lint and build Android debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew lintDebug assembleDebug --no-daemon

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: string-sort-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
