name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # @capacitor/assets includes an older native sharp dependency; when its
      # prebuilt binary is unavailable, it compiles against system libvips.
      - name: Install libvips headers for native assets tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev

      - name: Install dependencies
        run: npm install


      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Verify release readiness
        run: npm run verify:release

      - name: Generate Play Store static assets
        run: npm run assets:store

      - name: Upload Play Store static assets
        uses: actions/upload-artifact@v7
        with:
          name: string-sort-store-static-assets
          path: store/generated/
          if-no-files-found: error

  android-smoke:
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Use Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # @capacitor/assets includes an older native sharp dependency; when its
      # prebuilt binary is unavailable, it compiles against system libvips.
      - name: Install libvips headers for native assets tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Verify committed Capacitor Android project
        run: |
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/gradlew

      - name: Verify Android 16 / API 36 target
        run: node scripts/verify-android-target.mjs

      - name: Configure Android portrait orientation
        run: node scripts/prepare-android-manifest.mjs

      - name: Generate Android launcher and splash assets
        run: npm run assets

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Lint and build Android debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew lintDebug assembleDebug --no-daemon

      - name: Record debug APK checksum and source commit
        run: |
          set -euo pipefail
          cd android/app/build/outputs/apk/debug
          test -s app-debug.apk
          sha256sum app-debug.apk > app-debug.apk.sha256
          printf 'source_commit=%s\nworkflow_run=%s\n' \
            "$(git rev-parse HEAD)" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > build-info.txt

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: string-sort-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/outputs/apk/debug/build-info.txt
          if-no-files-found: error

      # Exercises the same production web payload / Gradle bundle task
      # as the manual signed release, without requiring owner signing secrets.
      # This unsigned output is deliberately NOT uploaded to avoid confusion
      # with the Play-ready signed bundle.
      - name: Build production web payload for AAB smoke test
        run: npm run build:prod

      - name: Sync production payload into Android
        run: npx cap sync android

      - name: Assemble unsigned production AAB
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon
          test -s app/build/outputs/bundle/release/app-release.aab

      # Verify the full signing/configuration path with a disposable key.
      # Never use or upload the real Play Console upload key in pull-request CI.
      # The signed smoke bundle is intentionally not published as an artifact.
      - name: Verify signed AAB with disposable CI key
        run: |
          set -euo pipefail
          keydir="$(mktemp -d)"
          trap 'rm -rf "$keydir"' EXIT
          export ANDROID_KEYSTORE_FILE="$keydir/smoke-upload.jks"
          export ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
          export ANDROID_KEY_ALIAS="string-sort-ci"
          export ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          export RELEASE_VERSION_CODE="42"
          export RELEASE_VERSION_NAME="0.1.0-ci"
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$ANDROID_KEYSTORE_FILE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -dname "CN=String Sort CI, OU=Automated Tests, O=Local Test" \
            -keyalg RSA -keysize 2048 -validity 1
          node scripts/prepare-android-signing.mjs
          (cd android && ./gradlew bundleRelease --no-daemon)
          bundle="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$bundle"
          verification="$(jarsigner -verify "$bundle" 2>&1)"
          grep -Fq 'jar verified.' <<< "$verification"
